name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Naghma/Naghma.csproj

      - name: Build
        run: dotnet build src/Naghma/Naghma.csproj -c Release --no-restore

      - name: Publish (portable, single file)
        run: >
          dotnet publish src/Naghma/Naghma.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath Naghma-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naghma-win-x64
          path: Naghma-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Naghma-win-x64.zip
          generate_release_notes: true
